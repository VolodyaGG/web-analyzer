---
- name: Docker install
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install dependencies
      apt:
        name:
          - ca-certificates
          - curl
        update_cache: yes
        state: present

    - name: Create directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download GPG
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false
      register: gpg_key_downloaded

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ (ansible_facts['architecture'] == 'x86_64') | ternary('amd64', 'arm64') }}
          Signed-By: /etc/apt/keyrings/docker.asc
        mode: '0644'
      register: repo_added

    - name: Update repository
      apt:
        update_cache: true
      when: gpg_key_downloaded.changed or repo_added.changed
      changed_when: false

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true